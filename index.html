<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#dfeeff">
  <title>毕业快乐</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eef6ff;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-line: rgba(80, 133, 196, 0.22);
      --hero: #1a4e8a;
      --hero-soft: #5f8fc6;
      --ink: #153a67;
      --ink-soft: #51759d;
      --glow: rgba(120, 173, 232, 0.2);
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(179, 214, 249, 0.55), transparent 24%),
        linear-gradient(180deg, #dcecff 0%, #eaf3ff 52%, #dbeafb 100%);
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px 14px;
      isolation: isolate;
      overflow: hidden;
    }

    .school-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0.44;
      filter: saturate(0.9) brightness(1.08) contrast(0.92);
      z-index: -3;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 16% 10%, rgba(147, 190, 240, 0.28), transparent 26%),
        radial-gradient(circle at 82% 16%, rgba(255, 255, 255, 0.24), transparent 30%),
        linear-gradient(180deg, rgba(244, 249, 255, 0.26), rgba(227, 239, 253, 0.34));
      z-index: -2;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(110, 158, 216, 0.28);
      pointer-events: none;
      z-index: -1;
    }

    .content {
      width: min(92vw, 760px);
      min-height: min(760px, calc(100svh - 40px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(30px, 6vw, 64px) clamp(18px, 5vw, 52px);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(245, 250, 255, 0.72));
      border: 1px solid var(--panel-line);
      backdrop-filter: blur(10px);
      box-shadow:
        0 22px 72px rgba(78, 118, 165, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .logo-bar {
      width: min(100%, 560px);
      display: grid;
      place-items: center;
      margin-bottom: clamp(24px, 4vw, 34px);
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(95, 143, 198, 0.2);
    }

    .college-logo {
      width: min(100%, 460px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 26px rgba(77, 122, 178, 0.12));
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--hero-soft);
      font-size: clamp(13px, 3vw, 17px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    h1 {
      margin: 0;
      color: var(--hero);
      font-size: clamp(50px, 13vw, 98px);
      line-height: 1.03;
      font-weight: 700;
      letter-spacing: 0;
      text-wrap: balance;
      text-shadow: 0 8px 28px rgba(111, 157, 209, 0.16);
    }

    .message {
      width: min(100%, 620px);
      margin: clamp(22px, 5vw, 36px) auto 0;
      color: var(--ink);
      font-size: clamp(19px, 4.7vw, 28px);
      line-height: 1.8;
      letter-spacing: 0;
    }

    .message-line {
      display: block;
      white-space: nowrap;
    }

    .signature {
      margin-top: clamp(26px, 5vw, 40px);
      color: var(--hero-soft);
      font-size: clamp(15px, 3.8vw, 20px);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 0.08em;
    }

    .missing {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: none;
      padding: 10px 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(95, 143, 198, 0.32);
      font: 13px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
      box-shadow: 0 12px 32px rgba(48, 78, 118, 0.12);
    }

    .missing code {
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(95, 143, 198, 0.1);
      font-family: Consolas, monospace;
    }

    @media (max-width: 520px) {
      .page {
        padding: 16px 10px;
      }

      .page::after {
        inset: 8px;
      }

      .content {
        min-height: calc(100svh - 32px);
        padding: 30px 16px 34px;
      }

      .logo-bar {
        margin-bottom: 22px;
        padding-bottom: 18px;
      }

      .college-logo {
        width: min(100%, 320px);
      }

      .message {
        font-size: clamp(18px, 5.1vw, 24px);
        line-height: 1.72;
      }

      .message-line {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img
      class="school-bg"
      src="assets/school-bg.png"
      alt=""
      aria-hidden="true"
      data-candidates="assets/school-bg.png,assets/school-bg.jpg,assets/school-bg.jpeg,assets/school-bg.webp"
    >

    <section class="content" aria-label="毕业祝福">
      <div class="logo-bar">
        <img
          class="college-logo"
          src="assets/college-logo.png"
          alt="微电子学院院徽"
          data-candidates="assets/college-logo.png,assets/college-logo.jpg,assets/college-logo.jpeg,assets/college-logo.webp"
        >
      </div>

      <p class="eyebrow">Class of 2026</p>
      <h1>毕业快乐</h1>
      <p class="message">
        <span class="message-line">愿我们带着校园里的光，</span>
        <span class="message-line">奔赴下一段山海。</span>
        <span class="message-line">前程似锦，青春不散场。</span>
      </p>
      <p class="signature">致每一位即将启程的同学</p>
    </section>

    <div class="missing">
      请上传背景图 <code>assets/school-bg.png</code> 和学院 Logo <code>assets/college-logo.png</code>。
    </div>
  </main>

  <script>
    function loadCandidates(selector, onMissing) {
      const image = document.querySelector(selector);
      const candidates = image.dataset.candidates.split(",");
      let index = 0;

      image.addEventListener("error", () => {
        index += 1;
        if (index < candidates.length) {
          image.src = candidates[index];
          return;
        }

        image.style.display = "none";
        if (onMissing) onMissing();
      });
    }

    loadCandidates(".school-bg", () => {
      document.querySelector(".missing").style.display = "block";
    });

    loadCandidates(".college-logo", () => {
      document.querySelector(".logo-bar").style.display = "none";
      document.querySelector(".missing").style.display = "block";
    });
  </script>
</body>
</html>
