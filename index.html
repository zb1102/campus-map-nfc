<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#ffffff">
  <title>校园地图</title>
  <style>
    :root {
      color-scheme: light;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #fff;
    }

    body {
      overflow: auto;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #fff;
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      min-height: 100svh;
      object-fit: contain;
      object-position: top center;
      background: #fff;
      touch-action: auto;
      -webkit-user-select: none;
      user-select: none;
    }

    .missing {
      display: none;
      width: min(92vw, 520px);
      margin: 18vh auto 0;
      padding: 18px 20px;
      border: 1px solid #d8dde7;
      border-radius: 8px;
      color: #273242;
      font: 16px/1.7 "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #fff;
    }

    .missing code {
      padding: 2px 5px;
      border-radius: 4px;
      background: #eef2f7;
      font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <main>
    <img
      class="map-image"
      src="assets/campus-map.png"
      alt="校园地图"
      draggable="false"
      data-candidates="assets/campus-map.png,assets/campus-map.jpg,assets/campus-map.jpeg,assets/campus-map.webp"
    >
    <div class="missing">
      没有找到地图图片。请把你的校园地图保存为
      <code>assets/campus-map.png</code>
      后重新打开本页面。
    </div>
  </main>
  <script>
    const image = document.querySelector(".map-image");
    const candidates = image.dataset.candidates.split(",");
    let index = 0;

    image.addEventListener("error", () => {
      index += 1;
      if (index < candidates.length) {
        image.src = candidates[index];
        return;
      }

      image.style.display = "none";
      document.querySelector(".missing").style.display = "block";
    });
  </script>
</body>
</html>
