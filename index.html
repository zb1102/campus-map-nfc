<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#d7ebff">
  <title>毕业快乐</title>
  <style>
    :root {
      color-scheme: light;
      --bg-top: #d8ebff;
      --bg-bottom: #c8e0fb;
      --panel: rgba(255, 255, 255, 0.52);
      --panel-border: rgba(78, 132, 196, 0.22);
      --title: #185197;
      --title-soft: #5c8fc8;
      --text: #234f84;
      --text-soft: #6a93c0;
      --frame: rgba(104, 154, 214, 0.26);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.55), transparent 26%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top)) 10px 18px;
      isolation: isolate;
      overflow: hidden;
    }

    .school-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0.68;
      filter: saturate(0.96) brightness(1.02) contrast(0.9);
      z-index: -3;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 14%, rgba(143, 190, 245, 0.18), transparent 24%),
        linear-gradient(180deg, rgba(245, 250, 255, 0.18), rgba(214, 232, 252, 0.16));
      z-index: -2;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid var(--frame);
      pointer-events: none;
      z-index: -1;
    }

    .content {
      width: min(100%, 720px);
      margin: 12px auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 18px 34px;
      background: none;
      border: 0;
      backdrop-filter: none;
      box-shadow: none;
    }

    .logo-bar {
      width: 100%;
      max-width: 340px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(92, 143, 200, 0.2);
    }

    .college-logo {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(61, 103, 160, 0.14));
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--title-soft);
      font-size: clamp(12px, 3.8vw, 16px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    h1 {
      margin: 0;
      color: var(--title);
      font-size: clamp(42px, 15vw, 88px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: 0;
      text-wrap: balance;
      text-shadow:
        0 4px 14px rgba(255, 255, 255, 0.42),
        0 8px 22px rgba(112, 158, 214, 0.14);
    }

    .message {
      width: 100%;
      max-width: 420px;
      margin: 22px auto 0;
      color: #1f4676;
      font-size: clamp(18px, 5vw, 28px);
      line-height: 1.78;
      letter-spacing: 0;
      text-shadow: 0 2px 12px rgba(255, 255, 255, 0.48);
    }

    .message-line {
      display: block;
    }

    .signature {
      margin-top: 26px;
      color: #5f89b8;
      font-size: clamp(14px, 4vw, 20px);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
    }

    .missing {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: none;
      padding: 10px 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(95, 143, 198, 0.28);
      font: 13px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
      box-shadow: 0 12px 30px rgba(55, 88, 133, 0.12);
    }

    .missing code {
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(95, 143, 198, 0.12);
      font-family: Consolas, monospace;
    }

    @media (min-width: 700px) {
      .page {
        align-items: center;
        padding: 18px;
      }

      .page::after {
        inset: 12px;
      }

      .content {
        margin-top: 0;
        padding: 34px 48px 46px;
      }

      .logo-bar {
        max-width: 520px;
        margin-bottom: 22px;
        padding-bottom: 18px;
      }

      .message {
        max-width: 540px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img
      class="school-bg"
      src="assets/school-bg.png"
      alt=""
      aria-hidden="true"
      data-candidates="assets/school-bg.png,assets/school-bg.jpg,assets/school-bg.jpeg,assets/school-bg.webp"
    >

    <section class="content" aria-label="毕业祝福">
      <div class="logo-bar">
        <img
          class="college-logo"
          src="assets/college-logo.png"
          alt="微电子学院院徽"
          data-candidates="assets/college-logo.png,assets/college-logo.jpg,assets/college-logo.jpeg,assets/college-logo.webp"
        >
      </div>

      <p class="eyebrow">Class of 2026</p>
      <h1>毕业快乐</h1>
      <p class="message">
        <span class="message-line">愿我们带着校园里的光，</span>
        <span class="message-line">奔赴下一段山海。</span>
        <span class="message-line">前程似锦，青春不散场。</span>
      </p>
      <p class="signature">致每一位即将启程的同学</p>
    </section>

    <div class="missing">
      请上传背景图 <code>assets/school-bg.png</code> 和学院 Logo <code>assets/college-logo.png</code>。
    </div>
  </main>

  <script>
    function loadCandidates(selector, onMissing) {
      const image = document.querySelector(selector);
      const candidates = image.dataset.candidates.split(",");
      let index = 0;

      image.addEventListener("error", () => {
        index += 1;
        if (index < candidates.length) {
          image.src = candidates[index];
          return;
        }

        image.style.display = "none";
        if (onMissing) onMissing();
      });
    }

    loadCandidates(".school-bg", () => {
      document.querySelector(".missing").style.display = "block";
    });

    loadCandidates(".college-logo", () => {
      document.querySelector(".logo-bar").style.display = "none";
      document.querySelector(".missing").style.display = "block";
    });
  </script>
</body>
</html>
