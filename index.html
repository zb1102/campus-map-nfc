<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#7ea6d3">
  <title>毕业快乐</title>
  <style>
    :root {
      color-scheme: light;
      --title: #f4f8ff;
      --title-shadow: rgba(20, 53, 97, 0.42);
      --text: #f8fbff;
      --text-soft: rgba(240, 247, 255, 0.86);
      --accent: #bfd9ff;
      --rule: rgba(235, 244, 255, 0.34);
      --frame: rgba(214, 231, 255, 0.26);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      color: var(--text);
      background: #5d88b6;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px 24px;
      isolation: isolate;
      overflow: hidden;
    }

    .school-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 1;
      filter: saturate(0.96) contrast(0.92) brightness(0.98);
      z-index: -4;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(49, 89, 139, 0.42) 0%, rgba(74, 111, 162, 0.26) 28%, rgba(95, 130, 178, 0.2) 52%, rgba(41, 66, 105, 0.34) 100%),
        radial-gradient(circle at 50% 26%, rgba(255, 255, 255, 0.1), transparent 22%),
        radial-gradient(circle at 50% 72%, rgba(27, 50, 86, 0.1), transparent 24%);
      z-index: -3;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid var(--frame);
      pointer-events: none;
      z-index: -2;
    }

    .content {
      width: min(100%, 760px);
      min-height: calc(100svh - 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 22px 10px 38px;
      position: relative;
    }

    .content::before {
      content: "";
      position: absolute;
      inset: 10px 6px 84px;
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(23, 49, 86, 0.36) 0%, rgba(35, 66, 109, 0.28) 22%, rgba(43, 71, 110, 0.2) 48%, rgba(52, 79, 118, 0.12) 72%, rgba(52, 79, 118, 0.02) 100%);
      backdrop-filter: blur(3px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 16px 32px rgba(16, 33, 61, 0.08);
      z-index: -1;
    }

    .logo-bar {
      width: min(100%, 360px);
      margin-bottom: 26px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--rule);
    }

    .college-logo {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter:
        drop-shadow(0 10px 24px rgba(8, 22, 46, 0.3))
        brightness(1.08);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: clamp(12px, 3.8vw, 16px);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      text-shadow: 0 3px 10px rgba(10, 27, 53, 0.42);
    }

    h1 {
      margin: 0;
      color: var(--title);
      font-size: clamp(46px, 15vw, 88px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: 0;
      text-shadow:
        0 2px 12px rgba(255, 255, 255, 0.12),
        0 12px 28px rgba(11, 28, 52, 0.46);
    }

    .message {
      width: 100%;
      max-width: 420px;
      margin-top: clamp(42px, 10vh, 78px);
      color: var(--text);
      font-size: clamp(18px, 5.2vw, 28px);
      line-height: 1.95;
      letter-spacing: 0;
      text-shadow: 0 4px 14px rgba(8, 24, 47, 0.5);
    }

    .message-line {
      display: block;
      margin-bottom: 8px;
    }

    .signature {
      margin-top: clamp(54px, 12vh, 108px);
      color: var(--text-soft);
      font-size: clamp(14px, 4.1vw, 20px);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 0.06em;
      text-shadow: 0 4px 12px rgba(10, 24, 46, 0.42);
    }

    .spacer {
      flex: 1;
      min-height: 90px;
    }

    .missing {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: none;
      padding: 10px 12px;
      color: #163d6d;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(156, 190, 231, 0.34);
      font: 13px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
      box-shadow: 0 12px 30px rgba(26, 53, 90, 0.14);
    }

    .missing code {
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(95, 143, 198, 0.12);
      font-family: Consolas, monospace;
    }

    @media (min-width: 700px) {
      .page {
        align-items: center;
        padding: 18px;
      }

      .page::after {
        inset: 14px;
      }

      .content {
        min-height: min(900px, calc(100svh - 48px));
        padding: 34px 28px 52px;
      }

      .content::before {
        inset: 12px 18px 92px;
      }

      .logo-bar {
        width: min(100%, 480px);
      }

      .message {
        max-width: 580px;
      }

      .signature {
        margin-top: 68px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img
      class="school-bg"
      src="assets/school-bg.png"
      alt=""
      aria-hidden="true"
      data-candidates="assets/school-bg.png,assets/school-bg.jpg,assets/school-bg.jpeg,assets/school-bg.webp"
    >

    <section class="content" aria-label="毕业祝福">
      <div class="logo-bar">
        <img
          class="college-logo"
          src="assets/college-logo.png"
          alt="微电子学院院徽"
          data-candidates="assets/college-logo.png,assets/college-logo.jpg,assets/college-logo.jpeg,assets/college-logo.webp"
        >
      </div>

      <p class="eyebrow">Class of 2026</p>
      <h1>毕业快乐</h1>

      <p class="message">
        <span class="message-line">愿我们带着校园里的光，</span>
        <span class="message-line">奔赴下一段山海。</span>
        <span class="message-line">前程似锦，青春不散场。</span>
      </p>

      <p class="signature">致每一位即将启程的同学</p>
      <div class="spacer" aria-hidden="true"></div>
    </section>

    <div class="missing">
      请上传背景图 <code>assets/school-bg.png</code> 和学院 Logo <code>assets/college-logo.png</code>。
    </div>
  </main>

  <script>
    function loadCandidates(selector, onMissing) {
      const image = document.querySelector(selector);
      const candidates = image.dataset.candidates.split(",");
      let index = 0;

      image.addEventListener("error", () => {
        index += 1;
        if (index < candidates.length) {
          image.src = candidates[index];
          return;
        }

        image.style.display = "none";
        if (onMissing) onMissing();
      });
    }

    loadCandidates(".school-bg", () => {
      document.querySelector(".missing").style.display = "block";
    });

    loadCandidates(".college-logo", () => {
      document.querySelector(".logo-bar").style.display = "none";
      document.querySelector(".missing").style.display = "block";
    });
  </script>
</body>
</html>
